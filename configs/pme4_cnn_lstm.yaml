experiment_name: pme4_cnn_lstm
seed: 42

data:
  cache_path: data_cache/pme4/pme4_cache.npz
  n_val_subjects: 1

model:
  type: cnn_lstm
  embedding_dim: 128

training:
  batch_size: 64
  epochs: 6
  learning_rate: 0.001
  weight_decay: 0.0001
  device: cpu

output:
  results_dir: results/emg/pme4
  embeddings_dir: embeddings/emg/pme4
  checkpoints_dir: checkpoints/emg/pme4
