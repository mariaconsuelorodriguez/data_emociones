experiment_name: ppg_cnn_bilstm
seed: 42

data:
  cache_path: data_cache/ppg/ppg_cache.npz
  n_val_subjects: 1

model:
  type: cnn_bilstm
  embedding_dim: 128

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  device: cpu
  use_class_weights: true

output:
  results_dir: results/ppg/external_ppg
  embeddings_dir: embeddings/ppg/external_ppg
  checkpoints_dir: checkpoints/ppg/external_ppg
